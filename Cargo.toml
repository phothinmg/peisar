[package]
name = "peisar"
version = "0.3.11"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/phothinmg/peisar"
readme = "README.md"
description = "A practical Markdown parser written in Rust"


[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
napi = { version = "3", features = ["serde-json"], optional = true }
napi-derive = { version = "3", optional = true }
serde_yaml = "0.9"
blake3 = "1.4"
notify = "6"
bincode = "1.3"

[build-dependencies]
napi-build = "2"

# Signal handling (SIGINT/Ctrl+C) for the `cache` example. `libc` is
# already in the dependency tree via `notify`, so this adds no new
# transitive crates. The signal API used (`signal`, `SIGINT`, `SIG_ERR`,
# `SIG_DFL`) is available on every supported target, Windows included.
[dev-dependencies]
libc = "0.2"


[lib]
name = "peisar"
path = "src/lib.rs"
# `rlib` for the CLI binary + integration tests; `cdylib` for the Node
# native addon (only built when the `napi` feature is on).
crate-type = ["rlib", "cdylib"]

[features]
default = []
npm = ["dep:napi", "dep:napi-derive"]


[[example]]
name = "cache_example"
path = "examples/cache/main.rs"
