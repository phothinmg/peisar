<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.9.0/github-markdown.min.css"
      integrity="sha512-Ouq1+UcR9ENXndFyd/YA9i+ETLJmX3WoaMBF/nDzdqJbipKGL/SAbkO+qjDoxfD/dhZs4ZqgR9vXkolrK77xmQ=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.12.0/styles/default.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/peisar@1.0.12/browser/peisar.min.js"></script>
    <title>Peisar in browser</title>
    <style>
      .markdown-body {
        box-sizing: border-box;
        min-width: 200px;
        max-width: 980px;
        margin: 0 auto;
        padding: 45px;
      }

      @media (max-width: 767px) {
        .markdown-body {
          padding: 15px;
        }
      }

      @media (prefers-color-scheme: dark) {
        body {
          background-color: #0d1117;
        }
      }
    </style>
  </head>
  <body>
    <article class="markdown-body" id="md"></article>
    <script>
      fetch("example.md")
        .then((r) => r.text())
        .then((txt) => {
          const peisar = new Peisar(txt, { fragment: true });
          document.getElementById("md").innerHTML = peisar.html;
        });
    </script>
  </body>
</html>
