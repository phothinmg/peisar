[package]
name = "peisar"
version = "0.1.4"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/phothinmg/peisar"
readme = "README.md"
description = "A practical Markdown parser written in Rust"


[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
napi = { version = "3", features = ["serde-json"] }
napi-derive = "3"
serde_yaml = "0.9"
blake3 = "1.4"
notify = "6"
bincode = "1.3"
toml = "1.1.6"

[build-dependencies]
napi-build = "2"


[lib]
name = "peisar"
path = "src/lib.rs"
# `rlib` for the CLI binary + integration tests; `cdylib` for the Node
# native addon (only built when the `napi` feature is on).
crate-type = ["rlib", "cdylib"]
