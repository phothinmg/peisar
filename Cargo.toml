[package]
name = "peisar"
version = "1.2.3"
edition = "2024"
rust-version = "1.86"
license = "Apache-2.0"
repository = "https://github.com/phothinmg/peisar"
readme = "README.md"
description = "A practical Markdown parser engineered in Rust"


[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
napi = { version = "3", features = ["serde-json"], optional = true }
napi-derive = { version = "3", optional = true }
peisar_yaml = "0.1.2"
peisar_ast = "1.2.14"

[build-dependencies]
napi-build = "2"


[lib]
name = "peisar"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[features]
default = []
npm = ["dep:napi", "dep:napi-derive", "peisar_yaml/npm", "peisar_ast/npm"]
yaml = []
ast = []
html = []
plugin = []
