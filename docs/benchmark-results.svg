<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 700" role="img" aria-labelledby="title description">
  <title id="title">Markdown renderer benchmark results</title>
  <desc id="description">Grouped bar charts compare average throughput in operations per second and average peak heap in mebibytes for Peisar, marked, markdown-it, showdown, and micromark with GFM on base, medium, and large Markdown documents. Each document size has its own vertical scale. Exact values are labeled above the bars.</desc>
  <style>
    text { fill: #24292f; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .heading { font-size: 22px; font-weight: 700; }
    .subtitle { fill: #57606a; font-size: 13px; }
    .panel-title { font-size: 16px; font-weight: 600; }
    .scale { fill: #57606a; font-size: 11px; }
    .value { font-size: 10px; }
    .category { font-size: 12px; font-weight: 600; }
    .legend { font-size: 13px; }
    .axis { stroke: #8c959f; stroke-width: 1; }
    .grid { stroke: #d8dee4; stroke-width: 1; }
  </style>
  <rect width="1140" height="700" rx="12" fill="#ffffff"/>

  <text x="36" y="38" class="heading">Markdown renderer benchmarks</text>
  <text x="36" y="61" class="subtitle">Same representative Markdown workload · documented repository snapshot</text>

  <rect x="306" y="78" width="14" height="14" rx="2" fill="#0969da"/>
  <text x="327" y="90" class="legend">Peisar</text>
  <rect x="402" y="78" width="14" height="14" rx="2" fill="#1a7f37"/>
  <text x="423" y="90" class="legend">marked</text>
  <rect x="500" y="78" width="14" height="14" rx="2" fill="#bf8700"/>
  <text x="521" y="90" class="legend">markdown-it</text>
  <rect x="658" y="78" width="14" height="14" rx="2" fill="#cf222e"/>
  <text x="679" y="90" class="legend">showdown</text>
  <rect x="782" y="78" width="14" height="14" rx="2" fill="#8250df"/>
  <text x="803" y="90" class="legend">micromark (GFM)</text>

  <text x="36" y="126" class="panel-title">Average throughput (operations/s)</text>
  <text x="36" y="145" class="subtitle">Higher is better · independent scale per document size</text>

  <text x="190" y="171" text-anchor="middle" class="category">Base</text>
  <text x="570" y="171" text-anchor="middle" class="category">Medium</text>
  <text x="950" y="171" text-anchor="middle" class="category">Large</text>
  <text x="190" y="190" text-anchor="middle" class="scale">Scale: 0–23,000 ops/s</text>
  <text x="570" y="190" text-anchor="middle" class="scale">Scale: 0–3,000 ops/s</text>
  <text x="950" y="190" text-anchor="middle" class="scale">Scale: 0–750 ops/s</text>

