[package]
name = "peisar"
version = "2.0.13"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/phothinmg/peisar"
readme = "README.md"
description = "A practical Markdown parser engineered in Rust"


[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
napi = { version = "3", features = ["serde-json"], optional = true }
napi-derive = { version = "3", optional = true }
peisar_ast = "1.2.15"

[build-dependencies]
napi-build = "2"


[lib]
name = "peisar"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[features]
default = []
npm = ["dep:napi", "dep:napi-derive", "peisar_ast/npm"]

[[example]]
name = "plugin"
path = "examples/rust/plugin.rs"

[[example]]
name = "parser_hook"
path = "examples/rust/parser_hook.rs"
