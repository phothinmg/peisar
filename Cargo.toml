[package]
name = "peisar"
version = "2.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/phothinmg/peisar"
readme = "README.md"
description = "A practical Markdown parser engineered in Rust"


[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
napi = { version = "3", optional = true }
napi-derive = { version = "3", optional = true }

[build-dependencies]
napi-build = "2"


[lib]
name = "peisar"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[features]
default = []
npm = ["dep:napi", "dep:napi-derive"]

# How to create Rust plugin
[[example]]
name = "plugin"
path = "examples/rust/plugin.rs"
